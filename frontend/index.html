<!DOCTYPE html>
<!--
  GrievEase Bot — chat widget (Day 3 prototype)

  Deliberately plain HTML/CSS/JS with no framework and no build step. This
  isn't the "impressive" choice — a React widget with a component library
  would look more polished in a screenshot. It's the right choice for a
  screening submission: every line here is something you can point at and
  explain, which matters more than the visual polish given the challenge's
  explicit note about being able to walk through your own work.

  How it talks to the backend: a single fetch() call to POST /api/chat per
  turn (see callChat() below). The whole "conversation" on this page is just:
  keep whatever session_id the server gives you on the first reply, and send
  it back on every subsequent message. The server (app/core/session_store.py)
  is what actually remembers where you are in a flow — this page holds no
  conversation logic of its own, only display logic.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrievEase Bot — GBU Grievance Assistant</title>
<style>
  :root {
    --navy: #1a2b4c;
    --accent: #3b5bdb;
    --accent-light: #e8f0fe;
    --bg: #f4f6fb;
    --bot-bubble: #ffffff;
    --user-bubble: #3b5bdb;
    --border: #d7dee9;
    --escalate: #e03131;
    --success: #0ca678;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }

  .widget {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(26, 43, 76, 0.12);
    display: flex;
    flex-direction: column;
    height: 85vh;
    max-height: 720px;
    overflow: hidden;
  }

  .header {
    background: var(--navy);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header .title { font-weight: 600; font-size: 16px; }
  .header .subtitle { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  /* Student ID gate — shown until a student ID is entered, then hidden.
     Stands in for real auth (see chat_schemas.py's docstring on why the
     backend accepts student_id directly in this prototype). */
  .id-gate {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--accent-light);
  }
  .id-gate label { font-size: 13px; color: var(--navy); font-weight: 600; }
  .id-gate input {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .id-gate button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .id-gate button:hover { background: #2f4bc4; }
  .id-gate.hidden { display: none; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .bubble.user {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    color: #1c1c1c;
    border-bottom-left-radius: 4px;
  }
  .bubble.escalated {
    border-color: var(--escalate);
    background: #fff5f5;
  }
  .bubble.ticket {
    border-color: var(--success);
    background: #f1fbf7;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .badge.escalated { background: var(--escalate); color: #fff; }
  .badge.ticket { background: var(--success); color: #fff; }

  .typing {
    font-size: 13px;
    color: #888;
    font-style: italic;
    padding-left: 4px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 14px;
    outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    width: 42px; height: 42px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .input-row button:disabled { background: #b7c2e0; cursor: not-allowed; }
  .input-row button:hover:not(:disabled) { background: #2f4bc4; }

  .config-note {
    font-size: 11px;
    color: #8a8a8a;
    text-align: center;
    padding: 6px 12px 0;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="header">
    <div class="avatar">🤖</div>
    <div>
      <div class="title">GrievEase Bot</div>
      <div class="subtitle">GBU Grievance Management Assistant</div>
    </div>
  </div>

  <!-- Shown first: a minimal stand-in for "you're logged into the student
       portal". Real deployment would read this from an auth session
       instead of a text box — see README for that note. -->
  <div class="id-gate" id="idGate">
    <label for="studentIdInput">Enter your Student ID to start</label>
    <input id="studentIdInput" type="text" placeholder="e.g. GBU2023CS101" />
    <button id="startBtn">Start Chat</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-row" id="inputRow" style="display:none;">
    <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">➤</button>
  </div>

  <div class="config-note">
    API: <span id="apiBaseLabel"></span> — change API_BASE at the top of the &lt;script&gt; if needed
  </div>
</div>

<script>
  // ---------------------------------------------------------------------
  // Configuration
  // ---------------------------------------------------------------------
  // Points at a local dev server by default (uvicorn app.main:app --reload).
  // Change this to your deployed API URL once you have one (Day 3's
  // deployment step) — this is the ONLY line that needs to change.
  const API_BASE = "http://localhost:8000";

  // ---------------------------------------------------------------------
  // Conversation state — intentionally tiny. The server is the source of
  // truth for where we are in a Submit/Track flow (session_store.py); this
  // page only needs to remember the session_id to keep pointing at the
  // same server-side conversation, and the student's identity for the
  // request body.
  // ---------------------------------------------------------------------
  let sessionId = null;
  let studentId = null;
  let studentEmail = null;

  const messagesEl = document.getElementById("messages");
  const idGateEl = document.getElementById("idGate");
  const inputRowEl = document.getElementById("inputRow");
  const messageInputEl = document.getElementById("messageInput");
  const sendBtnEl = document.getElementById("sendBtn");

  document.getElementById("apiBaseLabel").textContent = API_BASE;

  function addBubble(text, sender, { escalated = false, ticketId = null } = {}) {
    const row = document.createElement("div");
    row.className = `bubble-row ${sender}`;

    const bubble = document.createElement("div");
    bubble.className = `bubble ${sender}`;
    if (escalated) bubble.classList.add("escalated");
    if (ticketId) bubble.classList.add("ticket");

    if (escalated) {
      const badge = document.createElement("div");
      badge.className = "badge escalated";
      badge.textContent = "ESCALATED TO STAFF";
      bubble.appendChild(badge);
      bubble.appendChild(document.createElement("br"));
    } else if (ticketId) {
      const badge = document.createElement("div");
      badge.className = "badge ticket";
      badge.textContent = `TICKET ${ticketId}`;
      bubble.appendChild(badge);
      bubble.appendChild(document.createElement("br"));
    }

    bubble.appendChild(document.createTextNode(text));
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typingIndicator";
    el.textContent = "GrievEase Bot is typing...";
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  // ---------------------------------------------------------------------
  // The one function that talks to the backend. Everything else on this
  // page is just UI plumbing around this single call.
  // ---------------------------------------------------------------------
  async function callChat(message) {
    const body = {
      message,
      student_id: studentId,
    };
    if (sessionId) body.session_id = sessionId;
    if (studentEmail) body.student_email = studentEmail;

    const response = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API error ${response.status}: ${errText}`);
    }
    return response.json();
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addBubble(text, "user");
    messageInputEl.value = "";
    sendBtnEl.disabled = true;
    showTyping();

    try {
      const data = await callChat(text);
      sessionId = data.session_id;
      hideTyping();
      addBubble(data.reply, "bot", {
        escalated: data.escalated,
        ticketId: data.ticket_id,
      });
    } catch (err) {
      hideTyping();
      addBubble(
        "Sorry, I couldn't reach the server. Is the backend running at " +
        API_BASE + "? (" + err.message + ")",
        "bot",
      );
    } finally {
      sendBtnEl.disabled = false;
      messageInputEl.focus();
    }
  }

  // ---------------------------------------------------------------------
  // Wiring: student ID gate, then the actual chat input
  // ---------------------------------------------------------------------
  document.getElementById("startBtn").addEventListener("click", async () => {
    const idValue = document.getElementById("studentIdInput").value.trim();
    if (!idValue) return;
    studentId = idValue;

    idGateEl.classList.add("hidden");
    inputRowEl.style.display = "flex";
    messageInputEl.focus();

    // Kick off the conversation with a greeting so the menu shows immediately.
    showTyping();
    try {
      const data = await callChat("hi");
      sessionId = data.session_id;
      hideTyping();
      addBubble(data.reply, "bot");
    } catch (err) {
      hideTyping();
      addBubble(
        "Sorry, I couldn't reach the server. Is the backend running at " +
        API_BASE + "? (" + err.message + ")",
        "bot",
      );
    }
  });

  document.getElementById("studentIdInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("startBtn").click();
  });

  sendBtnEl.addEventListener("click", () => sendMessage(messageInputEl.value));
  messageInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage(messageInputEl.value);
  });
</script>

</body>
</html>
